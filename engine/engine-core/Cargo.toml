[package]
name = "engine-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "engine_core"
path = "src/lib.rs"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
engine-types = { workspace = true }
engine-wal = { workspace = true }
engine-marketdata = { workspace = true }
engine-venue = { workspace = true }
engine-risk = { workspace = true }
engine-strategies = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync", "signal"] }
toml = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }
hdrhistogram = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
