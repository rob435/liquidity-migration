[package]
name = "signal-worker"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lints]
workspace = true

[lib]
name = "signal_worker"
path = "src/lib.rs"

[[bin]]
name = "signal-worker"
path = "src/main.rs"

[dependencies]
bytes = { workspace = true }
engine-types = { workspace = true }
engine-strategies = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls = { workspace = true, features = ["webpki-roots", "http1", "ring"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "tokio"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
