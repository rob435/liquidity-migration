[package]
name = "market-tape"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lints]
workspace = true

[[bin]]
name = "market-tape"
path = "src/main.rs"

[dependencies]
engine-types = { workspace = true }
engine-marketdata = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
