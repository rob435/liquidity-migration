[workspace]
resolver = "2"
members = [
    "engine-types",
    "engine-public",
    "engine-wal",
    "engine-marketdata",
    "engine-venue",
    "engine-risk",
    "engine-strategies",
    "engine-core",
    "engine-tools",
    "signal-worker",
]

[workspace.dependencies]
async-trait = { version = "0.1.89" }
bytes = { version = "1.12.1" }
crc32c = { version = "0.6.8" }
engine-marketdata = { path = "engine-marketdata" }
engine-public = { path = "engine-public" }
engine-risk = { path = "engine-risk" }
engine-strategies = { path = "engine-strategies" }
engine-types = { path = "engine-types" }
engine-venue = { path = "engine-venue" }
engine-wal = { path = "engine-wal" }
futures-util = { version = "0.3.34" }
getrandom = { version = "0.4.3" }
hdrhistogram = { version = "7.6.0" }
hex = { version = "0.4.3" }
hmac = { version = "0.13.0" }
http-body-util = { version = "0.1.5" }
hyper = { version = "1.11.0" }
hyper-rustls = { version = "0.27.9", default-features = false }
hyper-util = { version = "0.1.20" }
k256 = { version = "0.14", default-features = false }
libc = { version = "0.2.189" }
num-bigint = { version = "0.4" }
num-rational = { version = "0.4" }
num-traits = { version = "0.2" }
rustls = { version = "0.23.43", default-features = false }
serde = { version = "1.0.229" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = { version = "0.11.0" }
sha3 = { version = "0.12" }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1" }
tokio-tungstenite = { version = "0.30.0" }
toml = { version = "1.1.4" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
rc_buffer = "deny"
unnecessary_self_imports = "deny"
rest_pat_in_fully_bound_structs = "deny"
empty_structs_with_brackets = "deny"
# Allocation and copy hygiene on the order path: build the default lazily,
# clone once, write into the string, pass a large value by reference.
or_fun_call = "deny"
redundant_clone = "deny"
format_push_string = "deny"
large_types_passed_by_value = "deny"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[profile.release]
lto = "thin"
codegen-units = 16

[profile.bench]
debug = true
