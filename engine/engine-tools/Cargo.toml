[package]
name = "engine-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "engine"
path = "src/engine.rs"

[[bin]]
name = "engine-tools"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../engine-core" }
engine-types = { workspace = true }
engine-wal = { workspace = true }
engine-marketdata = { workspace = true }
engine-venue = { workspace = true }
engine-risk = { workspace = true }
engine-strategies = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync", "signal"] }
toml = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
