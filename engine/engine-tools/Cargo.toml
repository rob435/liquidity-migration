[package]
name = "engine-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "engine"
path = "src/engine.rs"

[[bin]]
name = "engine-tools"
path = "src/main.rs"

[features]
default = ["bybit"]
bybit = ["engine-core/bybit", "engine-venue/bybit", "engine-marketdata/bybit"]
binance = ["engine-core/binance", "engine-venue/binance", "engine-marketdata/binance"]
hyperliquid = ["engine-core/hyperliquid", "engine-venue/hyperliquid", "engine-marketdata/hyperliquid"]
lighter = ["engine-core/lighter", "engine-venue/lighter", "engine-marketdata/lighter"]
mexc = ["engine-core/mexc", "engine-venue/mexc", "engine-marketdata/mexc"]
variational = ["engine-core/variational", "engine-venue/variational", "engine-marketdata/variational"]

[dependencies]
crc32c = { workspace = true }
base64 = { workspace = true }
engine-public = { workspace = true }
engine-core = { path = "../engine-core", default-features = false }
engine-types = { workspace = true }
engine-wal = { workspace = true }
engine-marketdata = { workspace = true, default-features = false }
engine-venue = { workspace = true, default-features = false }
engine-risk = { workspace = true }
engine-strategies = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync", "signal"] }
toml = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
