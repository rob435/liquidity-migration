# The engine's config. There is still no venue address in here on purpose:
# `venue` below is a name, not an address. It picks one of the adapters
# compiled into the venue crate, and every host that crate knows is a demo
# host — its own test reads the crate source back and fails the build if
# another appears. So no edit to this file can point the engine somewhere
# else; the most a wrong name can do is refuse to start.

[engine]
wal_path = "engine.wal"
# Which venue adapter to run. Leave the line out and it means this same one,
# so a config written before the key existed still says what it said.
venue = "bybit_demo"
# How often buffered log bytes are pushed to the OS. Order records do not
# wait for this — they are forced to disk before the order goes out.
group_flush_ms = 250
# How often the engine refreshes its account reading (it refreshes at half
# this number). The risk kernel's own staleness bound is the separate
# [risk] max_account_view_age_s below — tighten that one for protection.
account_view_max_age_ms = 5000
# Compute and log orders, send nothing. `--live` flips this; the risk kernel
# still gates every send either way.
shadow = true
# Where the research system writes its target book. Left out, as it is here,
# means no watcher runs at all — which is "no decision", not an empty book: a
# follower plug holds whatever it holds.
# target_book_path = "var/targets/carry.json"
# Where to write the heartbeat file: one line of JSON, rewritten every few
# seconds, saying when it was written, live or shadow, whose account it is on,
# whether it is still allowed to open positions, and what it has seen and sent.
# It decides nothing — whether any of that is alarming is the fleet watchdog's
# job. Left out, as it is here, means no file is written and nothing is said
# about it. `wall_ts_ms` is when it was written, the same spelling the log
# uses; `decide_*` is thinking time and `wire_*` is time to the wire, both in
# nanoseconds, and both null until an order has been through.
# heartbeat_path = "var/engine-heartbeat.json"

# The four capital controls. Nothing here has a default: every number is
# written down, and the Python fleet's values are recorded in
# engine-risk/PORT_NOTES.md.
[risk]
max_account_view_age_s = 120
# Daily loss ceiling against the UTC day's opening equity. Remove the line
# to run without a ceiling; the guard still refuses on blindness.
max_daily_loss_usdt = 10.0
# Account leverage: turns each strategy's capital into its gross share.
leverage = 2.0
# An order smaller than this after the partition clamp is refused, not sent.
min_order_notional_usdt = 1.0

[risk.envelope]
tracks_equity = true
# The reference the strategy capitals below were sized against.
reference_usdt = 100.0
equity_fraction = 1.0
floor_usdt = 100.0
expand_dead_band_fraction = 0.05
gross_notional_multiple = 2.0
disaster_stop_fraction = 0.35
# The account-wide caps. All three are sized against reference_usdt above and
# move with it, so this file is at the same 100 USDT test scale as the rest.
#
# Most gross notional on any one symbol. The one strategy below has a 100 USDT
# gross share (50 capital x 2 leverage) and one symbol to spend it on, so at
# this scale the symbol cap and that share bind in the same place. The mainnet
# profile sets it to half the reference — 50 USDT here — which is the number to
# copy once more than one symbol is traded.
max_symbol_notional_usdt = 100.0
# A second account-wide gross ceiling, at or below reference x
# gross_notional_multiple. Both Python profiles ship it equal to that cap, so it
# is equal here too and the envelope allowance is what binds.
max_component_gross_notional_usdt = 200.0
# Most margin the whole book may commit. Both Python profiles set this to the
# reference exactly.
max_initial_margin_usdt = 100.0

# One block per strategy — the plug seam. `name` and `capital_usdt` are the
# engine's (capital_usdt is this strategy's margin share of the partition;
# its gross share is capital times leverage). Every other key belongs to the
# strategy and is handed over as written.
[[strategy]]
name = "touch_sniper"
capital_usdt = 50.0
symbol = "BTCUSDT"
side = "buy"
trigger_px = 60000.0
qty = 0.001
stop_px = 59000.0
take_px = 61000.0
ttl_s = 3600
