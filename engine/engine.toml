# The engine's config. There is still no venue address in here on purpose:
# `venue` below is a name, not an address. It picks one of the adapters
# compiled into the venue crate, and every host that crate knows is written in
# one file per venue — its own test reads the crate source back and fails the
# build if a host appears anywhere else. So no edit to this file can point the
# engine at an endpoint nobody compiled in.
#
# Some of the names are funded accounts. Typing one here is not permission to
# trade it: those gateways refuse to build unless REAL_MONEY is armed in the
# host's credential file, by the owner. The most a wrong name in this file can
# do is stop the engine starting.

[engine]
wal_path = "engine.wal"
# WHICH VENUE. One name, and it decides all three of that venue's parts: the
# gateway that sends orders, the private stream that reports what happened to
# them, and the public feed the strategies price against. A config cannot
# half-switch.
#
#   bybit_demo           Bybit's practice account. Play money, real matching.
#   bybit_mainnet        Bybit's funded account. REAL MONEY.
#   hyperliquid_testnet  Hyperliquid's testnet.
#   hyperliquid_mainnet  Hyperliquid's funded account. REAL MONEY.
#   lighter_testnet      Lighter's testnet rollup.
#   lighter_mainnet      Lighter's funded account. REAL MONEY.
#   variational_mainnet  Variational. READ-ONLY, and not runnable: the venue
#                        publishes no trading API and no account read, so the
#                        engine stops at boot. Its market feed works on its
#                        own. The name exists so the adapter is wired for the
#                        day a trading API arrives.
#
# Each name reads its own credential variables — see .env.example — and none
# of them can authenticate another venue. Leave the line out and it means the
# Bybit demo account, so a config written before the key existed still says
# what it said.
#
# WHAT DIFFERS BETWEEN THEM, where it changes a decision:
#   - Bybit quotes funding for its next eight-hourly settlement. Hyperliquid
#     pays HOURLY and quotes the hourly rate. A carry number carried between
#     the two without scaling is out by a factor of eight.
#   - Hyperliquid and Lighter keep a stop as a separate reduce-only trigger
#     order, not as a field on the position, so a position with no such order
#     reads as unprotected and holds new risk back.
#   - Lighter cannot amend in place here, and cannot set leverage; it says so
#     in its caps and the engine works with that rather than around it.
venue = "bybit_demo"
# How often buffered log bytes are pushed to the OS. Order records do not
# wait for this — they are forced to disk before the order goes out.
group_flush_ms = 250
# How often the engine refreshes its account reading (it refreshes at half
# this number). The risk kernel's own staleness bound is the separate
# [risk] max_account_view_age_s below — tighten that one for protection.
account_view_max_age_ms = 5000
# Where the research system writes its target book. Left out, as it is here,
# means no watcher runs at all — which is "no decision", not an empty book: a
# follower plug holds whatever it holds.
#
# This line only works when exactly one strategy follows books, because it does
# not say which one it belongs to. An account running two sleeves puts the path
# in the strategy block instead (`book_path = "..."`), and then each book
# reaches its own sleeve and no other. That routing is what stops two followers
# on one account from acting on each other's decisions — the venue keeps one
# position per symbol and no note of who asked for it.
# target_book_path = "var/targets/carry.json"
# Where to write the heartbeat file: one line of JSON, rewritten every few
# seconds, saying when it was written, whose account it is on,
# whether it is still allowed to open positions, and what it has seen and sent.
# It decides nothing — whether any of that is alarming is the fleet watchdog's
# job. Left out, as it is here, means no file is written and nothing is said
# about it. `wall_ts_ms` is when it was written, the same spelling the log
# uses; `decide_*` is thinking time and `wire_*` is time to the wire, both in
# nanoseconds, and both null until an order has been through.
# heartbeat_path = "var/engine-heartbeat.json"

# The two capital controls. Nothing here has a default: every number is
# written down, and what each one means is in engine-risk/PORT_NOTES.md.
#
# THE OTHER WAY. Instead of writing the caps out, point at the profile
# document the Python fleet already reads, and the caps come from it:
#
#   [risk]
#   operational_profile_path = "configs/operational.mainnet.json"
#   max_account_view_age_s = 120
#   disaster_stop_fraction = 0.35
#
# Those last two are the only numbers the profile does not carry. Nothing else
# may be written beside them — an [risk.envelope] block or a stray `leverage`
# is refused, because one document decides the caps or two of them disagree in
# a way nobody notices until it matters.
#
# This is what a funded engine uses, so that tightening a cap tightens it for
# the fleet and the engine at once.
[risk]
max_account_view_age_s = 120
# Account leverage: turns the book's gross notional into the margin it commits.
leverage = 2.0

[risk.envelope]
tracks_equity = true
# The reference every cap below is sized against.
reference_usdt = 100.0
equity_fraction = 1.0
floor_usdt = 100.0
expand_dead_band_fraction = 0.05
gross_notional_multiple = 2.0
disaster_stop_fraction = 0.35
# The account-wide caps. Both are sized against reference_usdt above and move
# with it, so this file is at the same 100 USDT test scale as the rest.
#
# A second account-wide gross ceiling, at or below reference x
# gross_notional_multiple. Both Python profiles ship it equal to that cap, so it
# is equal here too and the envelope allowance is what binds.
max_component_gross_notional_usdt = 200.0
# Most margin the whole book may commit. Both Python profiles set this to the
# reference exactly.
max_initial_margin_usdt = 100.0

# One block per strategy — the plug seam. `name` and `sleeve` are the engine's:
# `sleeve` is what the log, the heartbeat and the cost report call this block,
# and defaults to `name`. Every other key belongs to the strategy and is handed
# over as written.
[[strategy]]
name = "touch_sniper"
symbol = "BTCUSDT"
side = "buy"
trigger_px = 60000.0
qty = 0.001
stop_px = 59000.0
take_px = 61000.0
ttl_s = 3600
