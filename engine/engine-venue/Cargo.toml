[package]
name = "engine-venue"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
engine-types = { path = "../engine-types" }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1"] }
# The account lease is a kernel flock, plus the stat calls that prove the
# locked file is still the file at the path. Already in the lock through
# tokio, so nothing new is pulled in.
libc = "0.2.189"
hyper-rustls = { version = "0.27.9", default-features = false, features = ["webpki-roots", "http1", "ring"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
# Hyperliquid signs with the account's own secp256k1 wallet key: an EIP-712
# digest, ECDSA, and the recovery id the venue needs to name the signer. The
# RustCrypto pair rather than a C binding, so the order path stays one
# toolchain and one build.
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.12"
# Direct only so the crypto provider can be named rather than inferred; see
# src/tls.rs. Already in the lock through hyper-rustls, so nothing new is
# pulled in.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
