[package]
name = "engine-venue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
engine-public = { workspace = true }
serde = { workspace = true, features = ["derive"] }
engine-types = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
# The account lease is a kernel flock, plus the stat calls that prove the
# locked file is still the file at the path. Already in the lock through
# tokio, so nothing new is pulled in.
libc = { workspace = true }
# Hyperliquid signs with the account's own secp256k1 wallet key: an EIP-712
# digest, ECDSA, and the recovery id the venue needs to name the signer. The
# RustCrypto pair rather than a C binding, so the order path stays one
# toolchain and one build.
k256 = { workspace = true, features = ["ecdsa", "std"] }
sha3 = { workspace = true }
# Direct only so the crypto provider can be named rather than inferred; see
# src/tls.rs. Already in the lock through hyper-rustls, so nothing new is
# pulled in.
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
