[package]
name = "engine-marketdata"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
engine-types = { workspace = true }
engine-public = { workspace = true }
futures-util = { workspace = true }
# The TLS provider tokio-tungstenite leaves for the caller to choose. Same
# provider engine-venue already picked, so the workspace links one.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
