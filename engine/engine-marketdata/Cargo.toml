[package]
name = "engine-marketdata"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engine-types = { path = "../engine-types" }
futures-util = "0.3.34"
# The TLS provider tokio-tungstenite leaves for the caller to choose. Same
# provider engine-venue already picked, so the workspace links one.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
