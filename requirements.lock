# Exact-pinned dependency contract for CI, initial VPS deploy, and same-commit
# activated recovery. Deploy paths install every entry with --no-deps and do
# not run an editable install or pip upgrade, so pyproject range resolution and
# unpinned build isolation cannot silently alter an authorized runtime.
# This file pins versions, not distribution hashes; regenerating it therefore
# requires review and a new authorized commit.
#
# Regenerate after an intentional dependency change:
#   .venv/bin/python -m pip freeze | grep -v '^-e ' > requirements.lock
