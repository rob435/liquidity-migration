# The Bybit market recorder on the host. Read by liquidity-migration-forward-capture.service,
# which passes --root; `python -m market_tape check --config deploy/capture/bybit-linear.toml`
# validates it.
#
# The ticker is the sensor: every listed name's funding rate, open interest, price,
# 24h turnover and 24h change, and best bid and ask, pushed as they change. The
# deep feeds (the 50-level book, every trade) go only where a sleeve acts, and they follow the action live: a name enters a tier within one
# maintenance tick of the ticker showing why. The budget keeps the month's inbound
# bytes under the host's share of its 4 TB line; the order of `shed` says what is
# given up first when the projection runs over.
schema = 1

[venue]
name = "bybit"
market = "linear"

[storage]
segment_max_mb = 64
# 30 days is the ceiling; max_disk_gb is what binds on this host, and the two
# recorders' caps must sum under the filesystem or they race min_free_disk_gb.
# Bybit is the venue we replay, so it holds the larger share: 60 GB is about
# three days on disk, and Drive keeps every hour permanently either way.
retention_days = 30
max_disk_gb = 60
min_free_disk_gb = 25
status_interval_seconds = 30

[connection]
topics_per_connection = 150

[snapshots]
cadence = "day"

[budget]
# Measured 2026-09-03 19:20 UTC, all feeds live: 1,390 GB/month with the sticky
# tiers freshly reset, 1,710 with them at their 48-hour width. The allowance is
# what the line affords once Binance stopped recording books (700 there, and the
# uploads): this recorder is the one whose data gets replayed, so it gets the
# room. Biggest lines: core:book:50 637, wide:ticker 320, core:trades 129,
# core:ticker 86.
#
# What `shed` may never contain, whatever the projection says:
#   core:book:50   the book every replay and the maker sleeve run on
#   core:trades    the prints a resting order fills against; without them a
#                  maker replay on a core name cannot fill at all
#   *:ticker       funding, open interest and price: the sensor every tier is
#                  resolved from and CARRY's entry signal
# So the order below gives up the discovery tiers first, their prints next, and
# the crowd books last. If that is not enough the recorder says so every hour
# rather than reaching for anything above.
monthly_gb = 1800
shed = [
  "bursting:book:50", "flooding:book:50", "levering:book:50", "movers:book:50", "surging:book:50",
  "bursting:trades", "flooding:trades", "levering:trades", "movers:trades", "surging:trades",
  "overheated:book:50", "crowded:book:50",
]

# Names that always get the full treatment whatever their rank: the maker canary.
[[tier]]
name = "pinned"
feeds = ["book:50", "book:1", "trades", "ticker", "liquidations"]
universe = { kind = "file", path = "deploy/forward-capture-symbols.txt" }

# LONG's universe: the thirty busiest USDT perpetuals by 24h turnover, live. A
# name stays until it falls below rank 45, so the boundary does not flap.
[[tier]]
name = "core"
feeds = ["book:50", "trades", "ticker", "liquidations"]
universe = { kind = "top_turnover", top = 30, leave_top = 45, quote = "USDT", exclude_tiers = ["pinned"] }

# The crowd fee (funding) at or below -8 bp: CARRY enters at -10 bp settled, so
# capture starts as the crowd forms and keeps the book two days after it thins.
[[tier]]
name = "crowded"
feeds = ["book:50", "trades"]
universe = { kind = "funding_below", threshold_bp = 8, sticky_hours = 48, quote = "USDT", exclude_tiers = ["pinned", "core"] }

# The crowd fee at or above +8 bp: longs paying up. The squeeze and the short
# side of the carry, the mirror of `crowded`.
[[tier]]
name = "overheated"
feeds = ["book:50", "trades"]
universe = { kind = "funding_above", threshold_bp = 8, sticky_hours = 48, quote = "USDT", exclude_tiers = ["pinned", "core", "crowded"] }

# Turnover three times what the day's snapshot showed: the pump LONG's trigger
# family looks for, in a name that was not in the top thirty when it started.
[[tier]]
name = "surging"
feeds = ["book:50", "trades"]
universe = { kind = "turnover_surge", ratio = 3, sticky_hours = 24, quote = "USDT", exclude_tiers = ["pinned", "core", "crowded", "overheated"] }

# The day's ten biggest movers either way, live; a name leaves below rank 15.
[[tier]]
name = "movers"
feeds = ["book:50", "trades"]
universe = { kind = "top_movers", top = 10, leave_top = 15, quote = "USDT", exclude_tiers = ["pinned", "core", "crowded", "overheated", "surging"] }

# A five percent move inside an hour, kept six hours: the pop as it happens.
[[tier]]
name = "bursting"
feeds = ["book:50", "trades"]
universe = { kind = "price_burst", pct = 0.05, window_hours = 1, sticky_hours = 6, quote = "USDT", exclude_tiers = ["pinned", "core", "crowded", "overheated", "surging", "movers"] }

# An hour that traded three average hours more than the same hour yesterday.
[[tier]]
name = "flooding"
feeds = ["book:50", "trades"]
universe = { kind = "volume_burst", ratio = 3, window_hours = 1, sticky_hours = 6, quote = "USDT", exclude_tiers = ["pinned", "core", "crowded", "overheated", "surging", "movers", "bursting"] }

# Open interest up or down ten percent inside an hour: leverage piling in or
# being flushed. Bybit pushes open interest on the ticker, so this costs nothing
# to watch.
[[tier]]
name = "levering"
feeds = ["book:50", "trades"]
universe = { kind = "oi_change", pct = 0.10, window_hours = 1, sticky_hours = 6, quote = "USDT", exclude_tiers = ["pinned", "core", "crowded", "overheated", "surging", "movers", "bursting", "flooding"] }

# Every other USDT perpetual the venue lists as trading: the ticker and the
# liquidations, nothing heavier.
[[tier]]
name = "wide"
feeds = ["ticker", "liquidations"]
universe = { kind = "listed", quote = "USDT", exclude_tiers = ["pinned", "core"] }
