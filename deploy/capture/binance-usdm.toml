# The Binance USD-M market recorder on the host. Read by
# liquidity-migration-forward-capture-binance.service, which passes --root;
# `python -m market_tape check --config deploy/capture/binance-usdm.toml` validates it.
#
# This recorder exists for cross-venue alpha, not for execution: nothing trades
# Binance. What that needs is the funding rate as it moves and a comparable
# price, which is the ticker (`markPrice@1s` carries the rate, the mark and the
# index) for every listed name, plus the trades where flow matters. It records
# no order book: `market_tape.bars` builds `mark_price`, `index_price`,
# `funding_rate` from the ticker and `open/high/low/close/vwap` from the trades,
# which is every column the cross-venue studies read. Bybit is the venue whose
# book is worth 50 levels, because Bybit is the venue we trade.
# Binance publishes the last settled funding rate, not a prediction, so the
# crowded tier reacts one settlement later than Bybit's.
schema = 1

[venue]
name = "binance"
market = "usdm"

[storage]
segment_max_mb = 64
# 30 days is the ceiling; max_disk_gb is what binds on this host, and the two
# recorders' caps must sum under the filesystem or they race min_free_disk_gb.
retention_days = 30
# Books are gone, so this tape is a fraction of its old size; the disk it no
# longer needs goes to the Bybit recorder, whose hours get replayed.
max_disk_gb = 18
min_free_disk_gb = 25
status_interval_seconds = 30

[connection]
# The venue caps a connection at 1024 streams; a ticker feed costs two streams
# a symbol, so 200 keeps every shard's URL short and well inside the cap.
topics_per_connection = 200

[snapshots]
cadence = "day"

[budget]
# Measured 2026-09-03 19:20 UTC, all feeds live: the 1000-level diff book cost
# 792 GB/month across the tiers that took it and served nothing any study reads,
# so no tier takes a book. `bookTicker` is not the cheaper substitute it looks
# like: 434 KB/s for twenty names, 1.1 TB/month, more than the diff book it
# would replace. What is left is the ticker at 375 and the trades at 176.
# The tickers are never shed: they are the cross-venue funding signal, the whole
# reason this recorder runs.
monthly_gb = 700
shed = [
  "bursting:trades", "flooding:trades", "movers:trades", "surging:trades",
  "overheated:trades", "crowded:trades", "core:trades",
]

[[tier]]
name = "core"
feeds = ["trades", "ticker", "liquidations"]
universe = { kind = "top_turnover", top = 15, leave_top = 22, quote = "USDT" }

[[tier]]
name = "crowded"
feeds = ["trades"]
universe = { kind = "funding_below", threshold_bp = 5, sticky_hours = 48, quote = "USDT", exclude_tiers = ["core"] }

[[tier]]
name = "overheated"
feeds = ["trades"]
universe = { kind = "funding_above", threshold_bp = 5, sticky_hours = 48, quote = "USDT", exclude_tiers = ["core", "crowded"] }

[[tier]]
name = "surging"
feeds = ["trades"]
universe = { kind = "turnover_surge", ratio = 3, sticky_hours = 24, quote = "USDT", exclude_tiers = ["core", "crowded", "overheated"] }

[[tier]]
name = "movers"
feeds = ["trades"]
universe = { kind = "top_movers", top = 10, leave_top = 15, quote = "USDT", exclude_tiers = ["core", "crowded", "overheated", "surging"] }

[[tier]]
name = "bursting"
feeds = ["trades"]
universe = { kind = "price_burst", pct = 0.05, window_hours = 1, sticky_hours = 6, quote = "USDT", exclude_tiers = ["core", "crowded", "overheated", "surging", "movers"] }

# Open interest is not on any Binance stream and would take one REST call per name
# per poll, so there is no open-interest tier here.
[[tier]]
name = "flooding"
feeds = ["trades"]
universe = { kind = "volume_burst", ratio = 3, window_hours = 1, sticky_hours = 6, quote = "USDT", exclude_tiers = ["core", "crowded", "overheated", "surging", "movers", "bursting"] }

[[tier]]
name = "wide"
feeds = ["ticker", "liquidations"]
universe = { kind = "listed", quote = "USDT", exclude_tiers = ["core"] }
