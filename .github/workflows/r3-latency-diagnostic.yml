name: Temporary R3 paired latency diagnostic
run-name: R3 paired latency a4189a48 archive vs rebuilt fc2ad99c

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  paired-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIAGNOSTIC_DIR: /tmp/r3-latency-${{ github.run_id }}
      BASELINE_RUN: '34074530152'
      BASELINE_SHA: a4189a4897409e65acba7a2078b964986ceea928
      CANDIDATE_SHA: fc2ad99c64cfa6652739caccd9da2ced2dc37583
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fc2ad99c64cfa6652739caccd9da2ced2dc37583
          persist-credentials: false

      - name: Record measurement environment
        run: |
          mkdir -p "$DIAGNOSTIC_DIR"
          {
            uname -a
            lscpu
            findmnt --target "$DIAGNOSTIC_DIR"
            df -T "$DIAGNOSTIC_DIR"
            cat /proc/loadavg /proc/pressure/cpu /proc/pressure/io
          } > "$DIAGNOSTIC_DIR/environment.log"

      - name: Download and verify baseline archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import release_artifact
          root = Path(os.environ["DIAGNOSTIC_DIR"])
          sha = os.environ["BASELINE_SHA"]
          name = f"engine-binaries-{sha}-qualified"
          download = Path(os.environ["RUNNER_TEMP"]) / "r3-baseline-download"
          subprocess.run(["gh", "run", "download", os.environ["BASELINE_RUN"],
                          "--repo", os.environ["GITHUB_REPOSITORY"], "--name", name,
                          "--dir", str(download)], check=True)
          manifest = release_artifact.verify(download / f"{name}.tar.gz", sha, root / "A")
          assert manifest["target"] == "x86_64-unknown-linux-gnu"
          assert manifest["checks"] == list(release_artifact.CHECKS)
          shutil.copyfile("docs/execution-latency-budgets.toml", root / "budgets.toml")
          PY

      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "engine -> target"
          save-if: 'false'

      - name: Build fresh diagnostic candidate using qualification recipe
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import release_artifact
          repo, sha = Path.cwd(), os.environ["CANDIDATE_SHA"]
          root = Path(os.environ["DIAGNOSTIC_DIR"])
          release_artifact._check_source(repo, sha)
          compiler = subprocess.check_output(["rustc", "--version", "--verbose"], text=True)
          assert compiler.startswith("rustc 1.90.0 ")
          target = "x86_64-unknown-linux-gnu"
          assert f"host: {target}" in compiler.splitlines()
          build = repo / "engine" / "target"
          with (root / "candidate-build.log").open("w") as log:
              log.write(f"Fresh diagnostic build of {sha}; CARGO_INCREMENTAL=0\n" + compiler)
              log.write("Original qualification 34081614240 remains failed: decision p99 9300 > 9000 ns. These are rebuilt bytes, not the failed-run or deployed bytes.\n")
              release_artifact._run(
                  ["cargo", "build", "--release", "--locked", "--workspace", "--bins",
                   "--examples", "--target-dir", str(build), "--target", target],
                  repo / "engine", log, sha)
          release_artifact._check_source(repo, sha)
          (root / "B").mkdir()
          for name in release_artifact.BINARIES:
              shutil.copy2(build / target / "release" / name, root / "B" / name)
          PY

      - name: Run all eight fixed cells before judging unchanged budgets
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import release_artifact
          root = Path(os.environ["DIAGNOSTIC_DIR"])
          budget = release_artifact._latency_budget(Path.cwd(), "linux-x86_64")
          assert budget["bench"] == {"events": 2000, "rate": 100, "every": 20, "symbols": ["BTCUSDT"]}
          assert budget["limits_ns"] == {"decision_p99_ns": 9000, "submit_p50_ns": 1635000}
          hashes = {label: release_artifact._binary_hashes(root / label) for label in "AB"}
          with (root / "images.log").open("w") as log:
              for label, binaries in hashes.items():
                  for name, digest in binaries.items():
                      log.write(f"{label}/{name} {digest}\n")
          results = []
          for index, label in enumerate("ABBABAAB", 1):
              cell = f"{index:02d}-{label}"
              print(f"Starting {cell}", flush=True)
              with (root / f"{cell}.log").open("w") as log:
                  try:
                      process = subprocess.run(
                          [str(root / label / "engine"), "bench", "--events", "2000",
                           "--rate", "100", "--every", "20", "--symbols", "BTCUSDT",
                           "--wal", str(root / f"{cell}.wal")],
                          stdout=log, stderr=subprocess.STDOUT, timeout=60)
                      exit_code = process.returncode
                  except (OSError, subprocess.TimeoutExpired) as error:
                      log.write(str(error) + "\n")
                      exit_code = -1
              results.append((cell, exit_code))
          failed = False
          for cell, exit_code in results:
              print(f"{cell}: bench exit={exit_code}", flush=True)
              failed |= exit_code != 0
              try:
                  release_artifact._check_latency((root / f"{cell}.log").read_text(), budget)
              except ValueError as error:
                  print(f"{cell}: {error}", flush=True)
                  failed = True
          for label in "AB":
              assert release_artifact._binary_hashes(root / label) == hashes[label]
          raise SystemExit(1 if failed else 0)
          PY

      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: r3-latency-paired-${{ github.run_id }}
          path: |
            ${{ env.DIAGNOSTIC_DIR }}/*.log
            ${{ env.DIAGNOSTIC_DIR }}/*.wal
            ${{ env.DIAGNOSTIC_DIR }}/budgets.toml
          retention-days: 2
          if-no-files-found: error
