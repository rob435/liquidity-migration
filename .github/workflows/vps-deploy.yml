name: CI and staged VPS operation
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}@{2}', inputs.mode, github.ref_name, github.sha) || format('checks {0}@{1}', github.ref_name, github.sha) }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Rollout, staged install/activation, or read-only verification.
        required: true
        default: verify
        type: choice
        options: [rollout, install, activate, verify, disarm-mainnet]
      profile:
        description: Deploy profile (single profile since the 2026-08-03 paper retirement).
        required: true
        default: operational
        type: choice
        options: [operational]

permissions:
  contents: read

concurrency:
  # Push/PR checks must not occupy or replace the deploy queue's single
  # pending slot while a safety disarm is preempting a rollout.
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('liquidity-migration-vps-{0}', github.ref)
        || format('liquidity-migration-ci-{0}', github.ref) }}
  # A funded disarm is the safety interrupt: it requests cancellation of the
  # running deploy. An ordinary dispatch cannot cancel a running disarm. GitHub
  # has no pending-run priority, so do not dispatch ordinary work while a
  # disarm is still pending behind cancellation of the previous run.
  cancel-in-progress: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'disarm-mainnet' }}

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'disarm-mainnet'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: -r requirements.lock
      # Through scripts/dev.sh so CI and the local gate check the same targets.
      # dev.sh falls back to `python3` when there is no .venv, which here is the
      # runner's setup-python interpreter.
      - name: Ruff
        run: scripts/dev.sh lint
      - name: Mypy
        run: scripts/dev.sh types
      - name: Pytest
        run: scripts/dev.sh test

  # The Rust execution engine. Independent of `ci`: a Python failure should not
  # hide an engine failure, or the other way round.
  rust:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'disarm-mainnet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the compiler; Cargo.lock pins and checksums crates.
      # Test the optimized binary we actually deploy, not a debug-only build.
      - name: Release tests (locked)
        run: cargo test --workspace --all-targets --release --locked
        working-directory: engine
      - name: Account-state soak (bounded, CPU and heap only)
        run: >-
          cargo run --release --locked -p engine-core
          --example account_state_soak --
          --operations 2000000
          --live-ids 65536
          --sample-ops 4096
          --history-rows 0,1000,10000,100000
          --repeats 3
          --json
        working-directory: engine
      - name: Engine order-path benchmark (local pretend venue)
        run: >-
          cargo run --release --locked -p engine-core --bin engine -- bench
          --events 20000
          --rate 0
          --every 20
          --symbols BTCUSDT
          --wal "$RUNNER_TEMP/engine-bench-${GITHUB_SHA}.wal"
        working-directory: engine
      - name: Build and smoke-test deploy artifact (locked)
        run: |
          cargo build --release --locked
          sha256sum target/release/engine | tee target/release/engine.sha256
          target/release/engine --help >/dev/null
        working-directory: engine

  # Safety action: stopping and persistently disarming funded units must remain
  # available even when a build or test is red. It still uses the exact pinned
  # identity/host checks and the remote script's fail-safe implementation.
  disarm:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'disarm-mainnet' &&
      github.repository == 'rob435/liquidity-migration' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '116.202.15.128' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_ED25519_FINGERPRINT: ${{ vars.VPS_ED25519_FINGERPRINT || 'SHA256:TJRbvgB8nfhwmNDv4hM3jDkPXnRv6BGLQ3cPst2PfE4' }}
      GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT: SHA256:Gki6YjdsUksh/TozZ/55sxSwimK7T9MOf2pgWSbqFNU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keygen -y -f ~/.ssh/vps_deploy_key > ~/.ssh/vps_deploy_key.pub
          ssh-keygen -lf ~/.ssh/vps_deploy_key.pub -E sha256 |
            grep -F "$GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT"
          printf '%s\n' \
            '116.202.15.128 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICf7380psA4UujIrKaLuxWINmEl7vmBAKLMa7CpL7Dvq' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F "$VPS_ED25519_FINGERPRINT"
      - name: Stop and persistently disarm mainnet
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="$GITHUB_SHA" \
          BRANCH=main \
          SSH_TARGET="$VPS_USER@$VPS_HOST" \
          SSH_OPTS="-i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3" \
          scripts/deploy_vps_live.sh disarm-mainnet

  vps:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode != 'disarm-mainnet' &&
      github.repository == 'rob435/liquidity-migration' &&
      github.ref == 'refs/heads/main'
    needs: [ci, rust]
    runs-on: ubuntu-latest
    environment: production
    # Bound the stopped window, but leave room for every guarded producer drain
    # and both post-activation verification passes on a loaded host.
    timeout-minutes: 120
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '116.202.15.128' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_ED25519_FINGERPRINT: ${{ vars.VPS_ED25519_FINGERPRINT || 'SHA256:TJRbvgB8nfhwmNDv4hM3jDkPXnRv6BGLQ3cPst2PfE4' }}
      GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT: SHA256:Gki6YjdsUksh/TozZ/55sxSwimK7T9MOf2pgWSbqFNU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keygen -y -f ~/.ssh/vps_deploy_key > ~/.ssh/vps_deploy_key.pub
          ssh-keygen -lf ~/.ssh/vps_deploy_key.pub -E sha256 |
            grep -F "$GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT"
          printf '%s\n' \
            '116.202.15.128 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICf7380psA4UujIrKaLuxWINmEl7vmBAKLMa7CpL7Dvq' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F "$VPS_ED25519_FINGERPRINT"
      - name: Run VPS mode
        env:
          DEPLOY_MODE_INPUT: ${{ inputs.mode }}
          DEPLOY_PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          deploy_args=("$DEPLOY_MODE_INPUT")
          # The deploy script accepts only `--profile` on rollout and rejects
          # any other flag outright.
          case "$DEPLOY_MODE_INPUT" in
            rollout) deploy_args+=(--profile "$DEPLOY_PROFILE_INPUT") ;;
            install|activate|verify) ;;
            *) exit 2 ;;
          esac
          EXPECTED_COMMIT="$GITHUB_SHA" \
          BRANCH=main \
          SSH_TARGET="$VPS_USER@$VPS_HOST" \
          SSH_OPTS="-i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3" \
          scripts/deploy_vps_live.sh "${deploy_args[@]}"
