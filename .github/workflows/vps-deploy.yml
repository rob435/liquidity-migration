name: CI and staged VPS operation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          Guarded flat-account rollout/recover, stopped install, authorized
          activation, or read-only verification.
        required: true
        default: verify
        type: choice
        options: [rollout, recover, install, activate, verify]
      profile:
        description: Operational profile bound by rollout/recover.
        required: false
        default: operational
        type: choice
        options: [operational, demo-operational]
      authorize_demo_paper_operation:
        description: >-
          Owner acknowledgement for rollout/recover. Ticking this appends the
          exact AUTHORIZE_DEMO_PAPER_OPERATION_WITHOUT_RESEARCH_PROMOTION
          handshake; it authorizes demo/paper operation only and grants no
          real-money authority.
        required: false
        default: false
        type: boolean
      authorization_reference:
        description: 1-500 character owner authorization reference (rollout/recover).
        required: false
        default: ""
        type: string
      reset_receipt:
        description: Absolute VPS reset-receipt path (recover only).
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: liquidity-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: -r requirements.lock
      - name: Ruff
        run: python -m ruff check liquidity_migration scripts tests
      - name: Mypy
        run: python -m mypy liquidity_migration
      - name: Pytest
        run: python -m pytest -q

  vps:
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: liquidity-migration-vps
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '116.202.15.128' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_ED25519_FINGERPRINT: ${{ vars.VPS_ED25519_FINGERPRINT || 'SHA256:TJRbvgB8nfhwmNDv4hM3jDkPXnRv6BGLQ3cPst2PfE4' }}
      GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT: SHA256:Gki6YjdsUksh/TozZ/55sxSwimK7T9MOf2pgWSbqFNU
    steps:
      - uses: actions/checkout@v7
      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keygen -y -f ~/.ssh/vps_deploy_key > ~/.ssh/vps_deploy_key.pub
          ssh-keygen -lf ~/.ssh/vps_deploy_key.pub -E sha256 |
            grep -F "$GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT"
          printf '%s\n' \
            '116.202.15.128 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICf7380psA4UujIrKaLuxWINmEl7vmBAKLMa7CpL7Dvq' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F "$VPS_ED25519_FINGERPRINT"
      - name: Run staged VPS mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_MODE_INPUT: ${{ inputs.mode }}
          DEPLOY_PROFILE_INPUT: ${{ inputs.profile }}
          DEPLOY_AUTHORIZATION_REFERENCE_INPUT: ${{ inputs.authorization_reference }}
          DEPLOY_OWNER_ACKNOWLEDGED_INPUT: ${{ inputs.authorize_demo_paper_operation }}
          DEPLOY_RESET_RECEIPT_INPUT: ${{ inputs.reset_receipt }}
        run: |
          deploy_args=("$DEPLOY_MODE_INPUT")
          case "$DEPLOY_MODE_INPUT" in
            rollout|recover)
              # The dispatching owner must tick the acknowledgement box; only
              # then is the exact demo/paper-only handshake string appended for
              # the remote guard. An unticked box fails the step here, before
              # any SSH mutation.
              test "$DEPLOY_OWNER_ACKNOWLEDGED_INPUT" = true
              deploy_args+=(--profile "$DEPLOY_PROFILE_INPUT")
              deploy_args+=(--authorization-reference "$DEPLOY_AUTHORIZATION_REFERENCE_INPUT")
              deploy_args+=(--owner-acknowledgement AUTHORIZE_DEMO_PAPER_OPERATION_WITHOUT_RESEARCH_PROMOTION)
              ;;
          esac
          if [ "$DEPLOY_MODE_INPUT" = recover ]; then
            deploy_args+=(--reset-receipt "$DEPLOY_RESET_RECEIPT_INPUT")
          fi
          EXPECTED_COMMIT="$GITHUB_SHA" \
          BRANCH="$GITHUB_REF_NAME" \
          SSH_TARGET="$VPS_USER@$VPS_HOST" \
          SSH_OPTS="-i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10" \
          scripts/deploy_vps_live.sh "${deploy_args[@]}"
