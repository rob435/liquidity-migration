name: CI and staged VPS operation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Guarded rollout/recovery, staged install/activation, or read-only verification.
        required: true
        default: verify
        type: choice
        options: [rollout, recover, install, activate, verify]
      profile:
        description: Demo-only or demo plus integration-only paper topology.
        required: true
        default: operational
        type: choice
        options: [operational, demo-operational]
      authorization_reference:
        description: Required owner/task reference for rollout or recovery.
        required: false
        type: string
      authorize_demo_paper_operation:
        description: Explicitly authorize bounded demo/paper operation; never REAL_MONEY.
        required: true
        default: false
        type: boolean
      reset_receipt:
        description: Absolute full-scope leave-stopped reset receipt; recovery only.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: liquidity-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: -r requirements.lock
      - name: Ruff
        run: python -m ruff check liquidity_migration scripts tests
      - name: Mypy
        run: python -m mypy liquidity_migration
      - name: Pytest
        run: python -m pytest -q

  vps:
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    # A rollout that stops the fleet and reinstalls takes single-digit minutes;
    # the 6-hour job default would hold a half-stopped fleet for hours before the
    # runner cancelled it (and a cancellation is exactly the disconnect the
    # remote HUP/PIPE traps now catch).
    timeout-minutes: 45
    concurrency:
      group: liquidity-migration-vps
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '116.202.15.128' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_ED25519_FINGERPRINT: ${{ vars.VPS_ED25519_FINGERPRINT || 'SHA256:TJRbvgB8nfhwmNDv4hM3jDkPXnRv6BGLQ3cPst2PfE4' }}
      GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT: SHA256:Gki6YjdsUksh/TozZ/55sxSwimK7T9MOf2pgWSbqFNU
    steps:
      - uses: actions/checkout@v7
      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keygen -y -f ~/.ssh/vps_deploy_key > ~/.ssh/vps_deploy_key.pub
          ssh-keygen -lf ~/.ssh/vps_deploy_key.pub -E sha256 |
            grep -F "$GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT"
          printf '%s\n' \
            '116.202.15.128 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICf7380psA4UujIrKaLuxWINmEl7vmBAKLMa7CpL7Dvq' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F "$VPS_ED25519_FINGERPRINT"
      - name: Run guarded VPS mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_MODE_INPUT: ${{ inputs.mode }}
          DEPLOY_PROFILE_INPUT: ${{ inputs.profile }}
          DEPLOY_AUTHORIZATION_REFERENCE_INPUT: ${{ inputs.authorization_reference }}
          DEPLOY_OWNER_ACKNOWLEDGED_INPUT: ${{ inputs.authorize_demo_paper_operation }}
          DEPLOY_RESET_RECEIPT_INPUT: ${{ inputs.reset_receipt }}
        run: |
          set -euo pipefail
          deploy_args=("$DEPLOY_MODE_INPUT")
          case "$DEPLOY_MODE_INPUT" in
            rollout)
              test "$DEPLOY_OWNER_ACKNOWLEDGED_INPUT" = true
              test -n "$DEPLOY_AUTHORIZATION_REFERENCE_INPUT"
              test -z "$DEPLOY_RESET_RECEIPT_INPUT"
              deploy_args+=(
                --profile "$DEPLOY_PROFILE_INPUT"
                --authorization-reference "$DEPLOY_AUTHORIZATION_REFERENCE_INPUT"
                --owner-acknowledgement AUTHORIZE_DEMO_PAPER_OPERATION_WITHOUT_RESEARCH_PROMOTION
              )
              ;;
            recover)
              test "$DEPLOY_OWNER_ACKNOWLEDGED_INPUT" = true
              test -n "$DEPLOY_AUTHORIZATION_REFERENCE_INPUT"
              test -n "$DEPLOY_RESET_RECEIPT_INPUT"
              deploy_args+=(
                --profile "$DEPLOY_PROFILE_INPUT"
                --authorization-reference "$DEPLOY_AUTHORIZATION_REFERENCE_INPUT"
                --owner-acknowledgement AUTHORIZE_DEMO_PAPER_OPERATION_WITHOUT_RESEARCH_PROMOTION
                --reset-receipt "$DEPLOY_RESET_RECEIPT_INPUT"
              )
              ;;
            install|activate|verify)
              test "$DEPLOY_OWNER_ACKNOWLEDGED_INPUT" = false
              test -z "$DEPLOY_AUTHORIZATION_REFERENCE_INPUT"
              test -z "$DEPLOY_RESET_RECEIPT_INPUT"
              ;;
            *) exit 2 ;;
          esac
          EXPECTED_COMMIT="$GITHUB_SHA" \
          BRANCH="$GITHUB_REF_NAME" \
          SSH_TARGET="$VPS_USER@$VPS_HOST" \
          SSH_OPTS="-i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3" \
          scripts/deploy_vps_live.sh "${deploy_args[@]}"
