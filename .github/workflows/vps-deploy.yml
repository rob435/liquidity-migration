name: CI and VPS operation
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}@{2}', inputs.mode, github.ref_name, github.sha) || format('checks {0}@{1}', github.ref_name, github.sha) }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy, roll back, verify, collect on-call diagnostics, or disarm funded trading.
        required: true
        default: verify
        type: choice
        options: [deploy, rollback, verify, diagnose, disarm-mainnet]

permissions:
  contents: read

concurrency:
  # Mutating VPS operations share one queue per ref, so a safety disarm can
  # preempt a deploy and two deploys never interleave. Read-only diagnosis and
  # push/PR checks get a group per run: an incident read must not wait behind an
  # unrelated release soak after the host handover has already finished.
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'diagnose'
        && format('liquidity-migration-vps-{0}', github.ref)
        || format('liquidity-migration-ci-{0}', github.run_id) }}
  # A funded disarm is the safety interrupt: it requests cancellation of the
  # running deploy. An ordinary dispatch cannot cancel a running disarm. GitHub
  # has no pending-run priority, so do not dispatch ordinary work while a
  # disarm is still pending behind cancellation of the previous run.
  cancel-in-progress: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'disarm-mainnet' }}

jobs:
  ci:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.mode != 'disarm-mainnet' && inputs.mode != 'diagnose')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: -r requirements.lock
      # Through scripts/dev.sh so CI and the local gate check the same targets.
      # dev.sh falls back to `python3` when there is no .venv, which here is the
      # runner's setup-python interpreter.
      - name: Ruff
        run: scripts/dev.sh lint
      - name: ShellCheck
        run: scripts/dev.sh shellcheck
      - name: Mypy
        run: scripts/dev.sh types
      - name: Pytest
        run: scripts/dev.sh test

  # The Rust execution engine. Independent of `ci`: a Python failure should not
  # hide an engine failure, or the other way round.
  rust:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.mode != 'disarm-mainnet' && inputs.mode != 'diagnose')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "engine -> target"
      # rust-toolchain.toml pins the compiler, rustfmt, and clippy; Cargo.lock
      # pins and checksums crates. The three gates docs/engine.md names for a
      # developer machine run here on the pinned toolchain.
      - name: rustfmt
        run: cargo fmt --all -- --check
        working-directory: engine
      - name: Clippy (locked, warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: engine
      # The same debug build clippy just produced: the suite runs in seconds,
      # and this is the profile scripts/dev.sh check tests with locally. The
      # optimized build is tested in the release job, off the deploy path.
      - name: Tests (locked)
        run: cargo test --workspace --all-targets --locked
        working-directory: engine

  # The deployed binaries, built beside `rust` rather than after it: this is the
  # only build that pays thin LTO, and `vps` gates on both jobs, so a red test
  # still blocks the deploy that consumes this artifact.
  rust-artifact:
    name: Deploy artifact
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.mode != 'disarm-mainnet' && inputs.mode != 'diagnose')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "engine -> target"
      - name: Build and smoke-test deploy artifact (locked)
        run: |
          cargo build --release --locked --workspace --bins
          (
            cd target/release
            sha256sum engine signal-worker market-tape > binaries.sha256
            ./engine --help >/dev/null
            ./signal-worker --help >/dev/null
            ./market-tape help >/dev/null 2>&1 || true
            tar -czf "$RUNNER_TEMP/engine-binaries-${GITHUB_SHA}.tar.gz" engine signal-worker market-tape binaries.sha256
          )
        working-directory: engine
      - name: Upload compiled release binaries
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: engine-binaries-${{ github.sha }}
          path: ${{ runner.temp }}/engine-binaries-${{ github.sha }}.tar.gz
          retention-days: 14

  # The optimized build's tests, soak and benchmark. After the gate and off the
  # deploy path: a red here is investigated, it does not hold a deploy.
  rust-soak-bench:
    name: Engine release tests, soak and benchmarks
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.mode != 'disarm-mainnet' && inputs.mode != 'diagnose')
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "engine -> target"
      - name: Release tests (locked)
        run: cargo test --workspace --all-targets --release --locked
        working-directory: engine
      - name: Account-state soak (bounded, CPU and heap only)
        run: >-
          cargo run --release --locked -p engine-core
          --example account_state_soak --
          --operations 2000000
          --live-ids 65536
          --sample-ops 4096
          --history-rows 0,1000,10000,100000
          --repeats 3
          --json
        working-directory: engine
      - name: Engine order-path benchmark (local pretend venue)
        run: >-
          cargo run --release --locked -p engine-core --bin engine -- bench
          --events 20000
          --rate 0
          --every 20
          --symbols BTCUSDT
          --wal "$RUNNER_TEMP/engine-bench-${GITHUB_SHA}.wal"
        working-directory: engine

  # Safety action: stopping and persistently disarming funded units must remain
  # available even when a build or test is red. It still uses the exact pinned
  # identity/host checks and the remote script's fail-safe implementation.
  disarm:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'disarm-mainnet' &&
      github.repository == 'rob435/liquidity-migration' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '208.84.103.4' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_ED25519_FINGERPRINT: ${{ vars.VPS_ED25519_FINGERPRINT || 'SHA256:WkfDoTe+g+IfcsH/tzXkd5BiasYJliBm0n1x9raLAfs' }}
      GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT: SHA256:Gki6YjdsUksh/TozZ/55sxSwimK7T9MOf2pgWSbqFNU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keygen -y -f ~/.ssh/vps_deploy_key > ~/.ssh/vps_deploy_key.pub
          ssh-keygen -lf ~/.ssh/vps_deploy_key.pub -E sha256 |
            grep -F "$GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 -- "$VPS_HOST" > ~/.ssh/known_hosts.candidate
          test -s ~/.ssh/known_hosts.candidate
          host_fingerprints="$(ssh-keygen -lf ~/.ssh/known_hosts.candidate -E sha256 | awk '{print $2}' | sort -u)"
          test "$host_fingerprints" = "$VPS_ED25519_FINGERPRINT"
          mv ~/.ssh/known_hosts.candidate ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stop and persistently disarm mainnet
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="$GITHUB_SHA" \
          BRANCH=main \
          SSH_TARGET="$VPS_USER@$VPS_HOST" \
          SSH_OPTS="-i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3" \
          scripts/deploy_vps_live.sh disarm-mainnet

  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'diagnose' &&
      github.repository == 'rob435/liquidity-migration' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '208.84.103.4' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_ED25519_FINGERPRINT: ${{ vars.VPS_ED25519_FINGERPRINT || 'SHA256:WkfDoTe+g+IfcsH/tzXkd5BiasYJliBm0n1x9raLAfs' }}
      GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT: SHA256:Gki6YjdsUksh/TozZ/55sxSwimK7T9MOf2pgWSbqFNU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keygen -y -f ~/.ssh/vps_deploy_key > ~/.ssh/vps_deploy_key.pub
          ssh-keygen -lf ~/.ssh/vps_deploy_key.pub -E sha256 |
            grep -F "$GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 -- "$VPS_HOST" > ~/.ssh/known_hosts.candidate
          test -s ~/.ssh/known_hosts.candidate
          host_fingerprints="$(ssh-keygen -lf ~/.ssh/known_hosts.candidate -E sha256 | awk '{print $2}' | sort -u)"
          test "$host_fingerprints" = "$VPS_ED25519_FINGERPRINT"
          mv ~/.ssh/known_hosts.candidate ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read fleet and watchdog state
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="$GITHUB_SHA" \
          BRANCH=main \
          SSH_TARGET="$VPS_USER@$VPS_HOST" \
          SSH_OPTS="-i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=10" \
          scripts/deploy_vps_live.sh verify
          ssh -i ~/.ssh/vps_deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            'systemctl --failed --no-pager; for unit in liquidity-migration-demo-liveness.service liquidity-migration-mainnet-liveness.service liquidity-migration-host-liveness.service liquidity-migration-equity-recorder.service; do systemctl show "$unit" --property=Id,Result,ExecMainStatus,ActiveEnterTimestamp --no-pager; journalctl -u "$unit" -n 12 --no-pager -o short-iso; done'

  vps:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode != 'disarm-mainnet' &&
      inputs.mode != 'diagnose' &&
      github.repository == 'rob435/liquidity-migration' &&
      github.ref == 'refs/heads/main'
    needs: [ci, rust, rust-artifact]
    runs-on: ubuntu-latest
    environment: production
    # Bound the stopped window; the deploy builds before it stops the fleet.
    timeout-minutes: 120
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '208.84.103.4' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_ED25519_FINGERPRINT: ${{ vars.VPS_ED25519_FINGERPRINT || 'SHA256:WkfDoTe+g+IfcsH/tzXkd5BiasYJliBm0n1x9raLAfs' }}
      GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT: SHA256:Gki6YjdsUksh/TozZ/55sxSwimK7T9MOf2pgWSbqFNU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keygen -y -f ~/.ssh/vps_deploy_key > ~/.ssh/vps_deploy_key.pub
          ssh-keygen -lf ~/.ssh/vps_deploy_key.pub -E sha256 |
            grep -F "$GITHUB_ACTIONS_DEPLOY_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 -- "$VPS_HOST" > ~/.ssh/known_hosts.candidate
          test -s ~/.ssh/known_hosts.candidate
          host_fingerprints="$(ssh-keygen -lf ~/.ssh/known_hosts.candidate -E sha256 | awk '{print $2}' | sort -u)"
          test "$host_fingerprints" = "$VPS_ED25519_FINGERPRINT"
          mv ~/.ssh/known_hosts.candidate ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Download compiled release binaries
        if: inputs.mode == 'deploy'
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: engine-binaries-${{ github.sha }}
          path: staged-binaries
      - name: Stage compiled release binaries onto VPS
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          test -f "staged-binaries/engine-binaries-${GITHUB_SHA}.tar.gz"
          ssh -i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/liquidity-migration-engine/staged"
          scp -i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "staged-binaries/engine-binaries-${GITHUB_SHA}.tar.gz" "$VPS_USER@$VPS_HOST:/opt/liquidity-migration-engine/staged/${GITHUB_SHA}.tar.gz"
      - name: Run VPS mode
        env:
          DEPLOY_MODE_INPUT: ${{ inputs.mode }}
          # The host fetches the exact commit from a private repository. Its own
          # https credential is not provisioned by anything here, so the deploy
          # carries this run's contents:read token to the host, which spends it
          # on one fetch in a 0600 config it then deletes. Without it the fetch
          # asks for a username, prompts are disabled, and the deploy stops.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE_INPUT" in
            deploy|rollback|verify) ;;
            *) exit 2 ;;
          esac
          EXPECTED_COMMIT="$GITHUB_SHA" \
          BRANCH=main \
          SSH_TARGET="$VPS_USER@$VPS_HOST" \
          SSH_OPTS="-i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3" \
          scripts/deploy_vps_live.sh "$DEPLOY_MODE_INPUT"
