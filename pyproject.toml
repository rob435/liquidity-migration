[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-migration"
version = "0.1.0"
description = "PIT research and demo/paper execution for liquidity-migration strategies."
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.0.0",
    "numpy>=2.1,<3.0",
    "Pillow>=10.0,<12",
    "polars>=1.0,<2",
    "pyarrow>=15.0,<22",
    "pybit>=5.8,<6",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0.12,<7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Static type checking is incremental. Run package-wide mypy before making a
# package-wide claim; any narrower passing scope must be named explicitly.
[tool.mypy]
python_version = "3.11"
files = ["liquidity_migration"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Polars aggregate scalar stubs overapproximate the values used in these paths.
[[tool.mypy.overrides]]
module = [
    "liquidity_migration.trade_lifecycle",
    "liquidity_migration.kline_store",
    "liquidity_migration.continuous_events",
]
disable_error_code = ["arg-type"]

[tool.setuptools.packages.find]
include = ["liquidity_migration*"]
