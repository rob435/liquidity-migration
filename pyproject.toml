[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-migration"
version = "0.1.0"
description = "Bybit liquidity-migration research system."
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.0.0",
    "numpy>=2.1,<3.0",
    "Pillow>=10.0,<12",
    "polars>=1.0,<2",
    "pyarrow>=15.0,<22",
    "pybit>=5.8,<6",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Static type checking. Adopted incrementally: lenient at the (un-stubbed) polars/
# numpy/pybit boundary, real checks on our own logic. Run: `mypy` (config below).
# Ratchet plan: the per-module `disable_error_code` relaxations below are the only
# debt — each is a polars Series-aggregate -> float() coercion the call site
# guarantees is numeric; the rung after green is replacing those with a None-safe
# helper, then enabling disallow_untyped_defs. Green today catches the bugs that
# matter (None-derefs, wrong Callable/return types, stale attrs).
[tool.mypy]
python_version = "3.11"
files = ["liquidity_migration"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# RATCHET DEBT (the only relaxations): the pure-compute modules below do
# `float(series.mean()/.sum()/.min())` on polars aggregates, which polars types as
# a broad `... | None` union — mypy can't see that the call site guarantees a
# finite number. arg-type stays ON everywhere else (it caught real wrong-type
# bugs in cli/ws_risk/daemons). Next rung: route these through a None-safe helper,
# then drop these overrides.
[[tool.mypy.overrides]]
module = [
    "liquidity_migration.trade_lifecycle",
    "liquidity_migration.kline_store",
    "liquidity_migration.volume_events_charts",
    "liquidity_migration.continuous_events",
    "liquidity_migration.signal_harness",
    "liquidity_migration.universe",
]
disable_error_code = ["arg-type"]

[tool.setuptools.packages.find]
include = ["liquidity_migration*"]

# Coverage. Run: `.venv/bin/python -m pytest --cov` (config below is picked up
# automatically). Measures the package only (not tests/scripts). No fail_under
# gate yet — the number is for visibility, not a hard CI bar; raise it
# deliberately once a baseline is agreed.
[tool.coverage.run]
source = ["liquidity_migration"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
