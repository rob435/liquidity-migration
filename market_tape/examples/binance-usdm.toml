# The Binance USD-M recorder as the host runs it, with the storage root filled in
# so it runs from this file alone: `python -m market_tape record --config THIS`.
# The ticker (mark and index with funding every second, the 24h ticker) is the
# sensor for every listed name; the deep book, the fast top of book, and the trades
# follow the action live. A machine with unbounded bandwidth would keep one tier,
# `listed` with every feed, and no budget.
schema = 1

[venue]
name = "binance"
market = "usdm"

[storage]
root = "/var/lib/liquidity-migration/forward-market-binance"
segment_max_mb = 64
retention_days = 30
max_disk_gb = 60
min_free_disk_gb = 25
status_interval_seconds = 30

[connection]
topics_per_connection = 200

[snapshots]
cadence = "day"

[budget]
monthly_gb = 1000
shed = ["movers:book:1000", "surging:book:1000", "movers:trades", "surging:trades", "core:book:1", "wide:ticker"]

[[tier]]
name = "core"
feeds = ["book:1000", "book:1", "trades", "ticker", "liquidations"]
universe = { kind = "top_turnover", top = 20, leave_top = 30, quote = "USDT" }

[[tier]]
name = "crowded"
feeds = ["book:1000", "book:1", "trades"]
universe = { kind = "funding_below", threshold_bp = 8, sticky_hours = 48, quote = "USDT", exclude_tiers = ["core"] }

[[tier]]
name = "surging"
feeds = ["book:1000", "book:1", "trades"]
universe = { kind = "turnover_surge", ratio = 3, sticky_hours = 24, quote = "USDT", exclude_tiers = ["core", "crowded"] }

[[tier]]
name = "movers"
feeds = ["book:1000", "book:1", "trades"]
universe = { kind = "price_move", pct = 0.15, sticky_hours = 24, quote = "USDT", exclude_tiers = ["core", "crowded", "surging"] }

[[tier]]
name = "wide"
feeds = ["ticker", "liquidations"]
universe = { kind = "listed", quote = "USDT", exclude_tiers = ["core"] }
