# The Binance USD-M market recorder. `python -m market_tape check --config
# market_tape/examples/binance-usdm.toml` validates it.
#
# A machine with unbounded bandwidth and disk would throw the tiers away and
# keep one: `listed` with every feed, so every perpetual gets the deep book.
# The three tiers below are what a 60 GB / one-box budget buys instead: the
# deep diff book only where it is likely to be read, the top of book
# everywhere.
schema = 1

[venue]
name = "binance"
market = "usdm"

[storage]
root = "/var/lib/liquidity-migration/forward-market-binance"
segment_max_mb = 64
retention_days = 30
max_disk_gb = 60
min_free_disk_gb = 25
status_interval_seconds = 30

[connection]
# The venue caps a connection at 1024 streams; a ticker feed costs two streams
# a symbol, so 200 keeps every shard's URL short and well inside the cap.
topics_per_connection = 200

[snapshots]
cadence = "day"

# The standing deep tier: the 60 busiest USDT perpetuals by 24h turnover, with
# the diff book (`book:1000`) anchored by a 1000-level REST snapshot on every
# connect. Binance names its own symbols, so the Bybit symbol file does not
# apply here and turnover picks the universe instead.
[[tier]]
name = "deep"
feeds = ["book:1000", "book:1", "trades", "ticker", "liquidations"]
universe = { kind = "top_turnover", top = 60, quote = "USDT" }

# Names whose funding rate sits at or below -10 bp (the crowd CARRY and Exodus
# trade) get the deep book for the day they qualify and the next.
[[tier]]
name = "crowded"
feeds = ["book:1000"]
universe = { kind = "funding_below", threshold_bp = 10, sticky_days = 2, quote = "USDT", exclude_tiers = ["deep"] }

# Every other USDT perpetual the venue lists as trading, re-read once a day.
[[tier]]
name = "wide"
feeds = ["book:1", "trades", "ticker", "liquidations"]
universe = { kind = "listed", quote = "USDT", exclude_tiers = ["deep"] }
